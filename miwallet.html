const pct = n=>n==null?"—":(n>=0?"+":"")+n.toFixed(1)+"%";
const mkKey  = d=>{const x=new Date(d);return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,"0")}`;};
const nowKey = ()=>mkKey(new Date());
const mkLbl  = k=>{if(!k)return"";const[y,m]=k.split("-");return new Date(+y,+m-1).toLocaleDateString("es-UY",{month:"short",year:"2-digit"}).replace(".","");};
const first1 = ()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-01`;};
const todayISO=()=>new Date().toISOString().slice(0,10);
function linReg(vals,n=3){const v=vals.slice(-4);if(v.length<2)return Array(n).fill(v[0]||0);const mx=(v.length-1)/2,my=v.reduce((a,b)=>a+b,0)/v.length;let num=0,den=0;v.forEach((y,x)=>{num+=(x-mx)*(y-my);den+=(x-mx)**2;});const s=den===0?0:num/den,b=my-s*mx;return Array.from({length:n},(_,i)=>Math.max(0,b+s*(v.length+i)));}
function fmtNum(raw){if(!raw&&raw!==0)return"";const s=String(raw).replace(/[^0-9.]/g,"");if(!s)return"";const[int,dec]=s.split(".");const fmt=int.replace(/\B(?=(\d{3})+(?!\d))/g,",");return dec!==undefined?`${fmt}.${dec}`:fmt;}
function rawNum(fmt){return String(fmt).replace(/,/g,"");}

/* ═══ GMAIL PARSING ═══ */
function b64decode(data){
  try{const bin=atob(data.replace(/-/g,"+").replace(/_/g,"/"));const b=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)b[i]=bin.charCodeAt(i);return new TextDecoder().decode(b);}catch{return"";}
}
function extractBody(payload){
  if(!payload)return"";
  if(payload.body?.data)return b64decode(payload.body.data);
  if(payload.parts){
    for(const p of payload.parts)if(p.mimeType==="text/plain"&&p.body?.data)return b64decode(p.body.data);
    for(const p of payload.parts){const r=extractBody(p);if(r)return r;}
  }
  return"";
}
function classifyMerchant(m){
  const u=m.toUpperCase();
  if(/DISCO|DEVOTO|GÉANT|GEANT|TIENDA INGLESA|TA-TA|TATA|WALMART|MULTIAHORRO|SUPERMERCADO/.test(u))return"Supermercado";
  if(/FARMACIA|FARMASHOP|CASMU|MUTUALISTA|MEDICA|CLINICA|HOSPITAL|OPTICA/.test(u))return"Salud";
  if(/ANTEL|UTE|OSE|NETFLIX|SPOTIFY|AMAZON|GOOGLE|APPLE|DISNEY|CLARO|MOVISTAR|HBO/.test(u))return"Servicios";
  if(/UBER|CABIFY|LATAM|AEROLINEAS|AEROL|HOTEL|AIRBNB|BOOKING|TURISMO/.test(u))return"Viajes";
  if(/ZARA|H&M|MANGO|CALZADO|ZAPATERIA|PEPE JEANS/.test(u))return"Indumentaria";
  if(/CINEMA|CINE|TEATRO|ESTADIO/.test(u))return"Entretenimiento";
  if(/UNIVERSIDAD|COLEGIO|INSTITUTO|ORT|UCU/.test(u))return"Educación";
  if(/RESTAURANT|RESTO|CAFE|CAFET|BAR |PIZZA|SUSHI|PARRILLA|PEDIDOSYA|RAPPI|DELIVERY|MOSTAZA|MCDONALD|BURGER|DELI|BREST|HELADERIA|PANADER|CANTINA|ROOFTOP/.test(u))return"Gastronomía";
  return"Otros";
}
function parseITAUEmail(msg){
  const headers=msg.payload?.headers||[];
  const dateH=headers.find(h=>h.name==="Date");
  const date=dateH?new Date(dateH.value):new Date();
  const dateStr=date.toISOString().slice(0,10);
  const body=extractBody(msg.payload);
  if(!body)return null;
  const amountM=body.match(/Importe:\s*([\d.]+)\s*(UYU|USD)/i);
  const merchantM=body.match(/Comercio:\s*(.+)/i);
  if(!amountM||!merchantM)return null;
  const amount=parseFloat(amountM[1]);
  const currency=amountM[2].toUpperCase();
  const merchant=merchantM[1].trim();
  return{
    id:`itau-${dateStr.replace(/-/g,"")}-${msg.id.slice(-8)}`,
    gmailId:msg.id,
    date:dateStr,
    merchant,
    amountUYU:currency==="UYU"?amount:null,
    amountUSD:currency==="USD"?amount:null,
    source:"ITAU",
    category:classifyMerchant(merchant),
  };
}

/* ═══ NumInput ═══ */
function NumInput({value,onChange,placeholder,style,className}){
  const handleChange=e=>{const stripped=e.target.value.replace(/[^0-9.]/g,"");const parts=stripped.split(".");const clean=parts.length>2?parts[0]+"."+parts.slice(1).join(""):stripped;onChange(clean);};
  return <input className={className||"ifield mono"} inputMode="decimal" type="text" value={fmtNum(value)} onChange={handleChange} placeholder={placeholder||"0.00"} style={style}/>;
}

/* ═══ ROOT APP ═══ */
function App(){
  const [tab,         setTab]         = useState("home");
  const [rate,        setRate]        = useState(null);
  const [customRate,  setCustomRate]  = useState(null);
  const [rateSource,  setRateSource]  = useState("auto");
  const [showRateInfo,setShowRateInfo]= useState(false);
  const [savings,     setSavings]     = useState([]);
  const [fixedExp,    setFixedExp]    = useState([]);
  const [varExp,      setVarExp]      = useState([]);
  const [income,      setIncome]      = useState({});
  const [loaded,      setLoaded]      = useState(false);
  const [savedAt,     setSavedAt]     = useState(null);
  /* Gmail state */
  const [gmailClientId,  setGmailClientId]  = useState("");
  const [gmailToken,     setGmailToken]     = useState(null); // {token, expiry}
  const [gmailConnected, setGmailConnected] = useState(false);
  const [gisLoaded,      setGisLoaded]      = useState(false);
  const [syncing,        setSyncing]        = useState(false);
  const [syncMsg,        setSyncMsg]        = useState("");

  useEffect(()=>{ injectStyles(); },[]);

  /* GIS polled from HTML script tag */
  useEffect(()=>{
    const t=setInterval(()=>{if(window.google?.accounts?.oauth2){setGisLoaded(true);clearInterval(t);}},250);
    return()=>clearInterval(t);
  },[]);

  /* Load persisted data */
  useEffect(()=>{
    (async()=>{
      const[sav,fx,vx,inc,cr,gcid]=await Promise.all([
        sGet("wlt:sav:v1"),sGet("wlt:fx:v1"),sGet("wlt:vx:v1"),
        sGet("wlt:inc:v1"),sGet("wlt:rate:v1"),sGet("wlt:gcid:v1"),
      ]);
      if(sav)setSavings(sav);if(fx)setFixedExp(fx);
      if(vx)setVarExp(vx);if(inc)setIncome(inc);
      if(cr){setCustomRate(cr.value);setRateSource(cr.source||"auto");}
      if(gcid)setGmailClientId(gcid);
      setLoaded(true);
    })();
  },[]);

  const save=async(k,v)=>{await sSet(k,v);setSavedAt(new Date().toLocaleTimeString("es-UY",{hour:"2-digit",minute:"2-digit"}));};
  useEffect(()=>{if(loaded)save("wlt:sav:v1",savings);},[savings,loaded]);
  useEffect(()=>{if(loaded)save("wlt:fx:v1",fixedExp);},[fixedExp,loaded]);
  useEffect(()=>{if(loaded)save("wlt:vx:v1",varExp);},[varExp,loaded]);
  useEffect(()=>{if(loaded)save("wlt:inc:v1",income);},[income,loaded]);
  useEffect(()=>{if(loaded)sSet("wlt:rate:v1",{value:customRate,source:rateSource});},[customRate,rateSource,loaded]);
  useEffect(()=>{if(gmailClientId)sSet("wlt:gcid:v1",gmailClientId);},[gmailClientId]);

  useEffect(()=>{
    fetch(ER_API).then(r=>r.json()).then(d=>setRate(d?.rates?.UYU||null)).catch(()=>setRate(41.5));
  },[]);

  const effRate=rateSource==="manual"&&customRate?+customRate:rate;
  const toUSD=tx=>{if(tx.amountUSD)return +tx.amountUSD;if(tx.amountUYU&&effRate)return tx.amountUYU/effRate;return 0;};
  const fxToUSD=fx=>{if(!fx.currency||fx.currency==="USD")return +fx.amount||0;if(fx.currency==="UYU"&&effRate)return(+fx.amount||0)/effRate;return +fx.amount||0;};

  /* Gmail connect */
  const connectGmail=(clientId)=>{
    const id=clientId||gmailClientId;
    if(!window.google?.accounts?.oauth2||!id){setSyncMsg("Completá el setup primero");return;}
    const client=window.google.accounts.oauth2.initTokenClient({
      client_id:id,scope:GIS_SCOPE,
      callback:(res)=>{
        if(res.error){setSyncMsg("Error al conectar: "+res.error);return;}
        setGmailToken({token:res.access_token,expiry:Date.now()+(+res.expires_in*1000)});
        setGmailConnected(true);
        setSyncMsg("✓ Gmail conectado");
        setTimeout(()=>setSyncMsg(""),3000);
      },
    });
    client.requestAccessToken();
  };

  /* Gmail sync */
  const syncGmail=async()=>{
    if(!gmailToken||Date.now()>gmailToken.expiry){
      setSyncMsg("Sesión expirada, reconectando…");
      connectGmail(); return;
    }
    setSyncing(true);setSyncMsg("Buscando emails de ITAU…");
    const token=gmailToken.token;
    try{
      /* 1. Collect all message IDs */
      let messages=[];let pageToken=null;
      do{
        const q=encodeURIComponent('from:comunicaciones@itau.com.uy subject:"Aviso de consumo aprobado"');
        const url=`${GMAIL_API}/messages?q=${q}&maxResults=100${pageToken?"&pageToken="+pageToken:""}`;
        const res=await fetch(url,{headers:{Authorization:`Bearer ${token}`}});
        if(res.status===401){setGmailToken(null);setGmailConnected(false);setSyncMsg("Sesión expirada. Presioná 'Conectar Gmail'.");setSyncing(false);return;}
        const data=await res.json();
        if(data.error){setSyncMsg("Error Gmail: "+data.error.message);setSyncing(false);return;}
        if(data.messages)messages=[...messages,...data.messages];
        pageToken=data.nextPageToken;
      }while(pageToken&&messages.length<500);

      if(messages.length===0){setSyncMsg("No se encontraron emails de ITAU.");setSyncing(false);return;}
      setSyncMsg(`${messages.length} emails encontrados, procesando…`);

      /* 2. Filter already-imported */
      const imported=new Set(varExp.map(t=>t.gmailId).filter(Boolean));
      const fresh=messages.filter(m=>!imported.has(m.id));
      if(fresh.length===0){setSyncMsg("Todo actualizado, sin nuevas transacciones.");setSyncing(false);return;}

      /* 3. Fetch new messages in parallel batches of 10 */
      const transactions=[];
      const BATCH=10;
      for(let i=0;i<fresh.length;i+=BATCH){
        setSyncMsg(`Procesando ${Math.min(i+BATCH,fresh.length)}/${fresh.length}…`);
        const batch=fresh.slice(i,i+BATCH);
        const fetched=await Promise.all(
          batch.map(m=>fetch(`${GMAIL_API}/messages/${m.id}?format=full`,{headers:{Authorization:`Bearer ${token}`}}).then(r=>r.json()))
        );
        for(const msg of fetched){const tx=parseITAUEmail(msg);if(tx)transactions.push(tx);}
      }

      if(transactions.length===0){setSyncMsg("Emails encontrados pero sin datos válidos.");}
      else{
        let n=0;
        setVarExp(prev=>{const ids=new Set(prev.map(t=>t.id));const newTx=transactions.filter(t=>!ids.has(t.id));n=newTx.length;return[...prev,...newTx];});
        setTimeout(()=>setSyncMsg(`✓ ${n} nuevas transacciones importadas`),80);
      }
    }catch(e){setSyncMsg("Error: "+e.message);}
    setSyncing(false);setTimeout(()=>setSyncMsg(""),8000);
  };

  /* Derived */
  const sortedSav=[...savings].sort((a,b)=>new Date(b.date)-new Date(a.date));
  const getTot=e=>SAV_KEYS.reduce((s,k)=>s+(+e?.[k]||0),0);
  const curTot=sortedSav[0]?getTot(sortedSav[0]):0;
  const prevTot=sortedSav[1]?getTot(sortedSav[1]):0;
  const diffNom=prevTot?curTot-prevTot:null;
  const diffPct=prevTot&&prevTot>0?((curTot-prevTot)/prevTot)*100:null;
  const last6=Array.from({length:6},(_,i)=>{const d=new Date();d.setMonth(d.getMonth()-(5-i));return mkKey(d);});
  const monthlySpend=last6.map(mk=>varExp.filter(t=>mkKey(t.date)===mk).reduce((s,t)=>s+toUSD(t),0));
  const totalFixedMonthly=fixedExp.filter(f=>f.active).reduce((s,f)=>s+fxToUSD(f),0);

  const gmailProps={gmailClientId,setGmailClientId,gmailToken,gmailConnected,setGmailConnected,gisLoaded,connectGmail,syncGmail,syncing,syncMsg};
  const shared={effRate,toUSD,fxToUSD,savings,setSavings,fixedExp,setFixedExp,varExp,setVarExp,income,setIncome,sortedSav,getTot,curTot,prevTot,diffNom,diffPct,last6,monthlySpend,totalFixedMonthly,...gmailProps};

  return(
    <div style={{maxWidth:430,margin:"0 auto",height:"100dvh",display:"flex",flexDirection:"column",background:T.bg,overflow:"hidden"}}>
      <TopBar effRate={effRate} rateSource={rateSource} onEditRate={()=>setShowRateInfo(true)} savedAt={savedAt} gmailConnected={gmailConnected}/>
      <div style={{flex:1,overflowY:"auto",overflowX:"hidden"}}>
        {tab==="home"       &&<TabHome       {...shared}/>}
        {tab==="patrimonio" &&<TabPatrimonio {...shared}/>}
        {tab==="gastos"     &&<TabGastos     {...shared}/>}
        {tab==="reportes"   &&<TabReportes   {...shared}/>}
      </div>
      <BottomNav tab={tab} setTab={setTab}/>

                  <div style={{fontSize:13,fontWeight:600,color:T.sub,marginBottom:2}}>{entry.date}</div>

                  <span style={{fontSize:12,color:T.sub,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{SAV_INFO[k].label}</span>
                </div>
                <NumInput value={form[k]} onChange={v=>setForm(p=>({...p,[k]:v}))} style={{width:110,textAlign:"right",flexShrink:0}}/>
              </div>
            ))}
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"12px 16px",background:T.bg,borderRadius:14,marginTop:4}}>
              <span style={{fontSize:14,fontWeight:600}}>Total USD</span>
              <span className="mono" style={{fontSize:22,fontWeight:700,color:T.blue}}>{f0(formTotal)}</span>

/* ═══ GASTOS FIJOS ═══ */
function GastosFijos({fixedExp,setFixedExp,fxToUSD}){
  const[showForm,setShowForm]=useState(false);
  const[editId,setEditId]=useState(null);
  const blank={name:"",amount:"",currency:"USD",owner:"compartido",active:true};
  const[form,setForm]=useState(blank);
  const openNew=()=>{setForm(blank);setEditId(null);setShowForm(true);};
  const openEdit=fx=>{setForm({name:fx.name,amount:String(fx.amount),currency:fx.currency||"USD",owner:fx.owner,active:fx.active});setEditId(fx.id);setShowForm(true);};
  const save=()=>{
    if(!form.name.trim())return;
    const id=editId||`fx-${Date.now()}`;
    const entry={id,...form,amount:+rawNum(form.amount)||0};
    setFixedExp(prev=>[...prev.filter(e=>e.id!==id),entry].sort((a,b)=>a.name.localeCompare(b.name)));
    setShowForm(false);
  };
  const toggle=id=>setFixedExp(prev=>prev.map(f=>f.id===id?{...f,active:!f.active}:f));
  const del=id=>setFixedExp(prev=>prev.filter(f=>f.id!==id));
  const active=fixedExp.filter(f=>f.active);
  const byOwner=OWNERS.map(o=>({owner:o,total:active.filter(f=>f.owner===o).reduce((s,f)=>s+fxToUSD(f),0)})).filter(x=>x.total>0);
  const grouped=OWNERS.map(o=>({owner:o,items:fixedExp.filter(f=>f.owner===o)})).filter(g=>g.items.length>0);
  return(
    <>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
        <div style={{display:"flex",gap:8,flexWrap:"wrap",flex:1}}>
          {byOwner.map(({owner,total})=>(<div key={owner} style={{background:OWN[owner].soft,borderRadius:20,padding:"6px 12px",display:"flex",gap:6,alignItems:"center"}}><span style={{fontSize:12,fontWeight:600,color:OWN[owner].color}}>{OWN[owner].label}</span><span className="mono" style={{fontSize:12,fontWeight:700,color:OWN[owner].color}}>{f0(total)}</span></div>))}
        </div>
        <button className="btn-blue" onClick={openNew} style={{borderRadius:12,padding:"9px 13px",flexShrink:0,marginLeft:8}}><Plus size={15}/></button>
      </div>
      {grouped.map(({owner,items})=>(
        <div key={owner}>
          <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:8}}><OwnerBadge owner={owner}/><span className="mono" style={{fontSize:12,color:T.sub,marginLeft:"auto"}}>{f0(items.filter(f=>f.active).reduce((s,f)=>s+fxToUSD(f),0))}/mes</span></div>
          <div className="list-card">
            {items.map(fx=>(
              <div key={fx.id} className="row-item" style={{opacity:fx.active?1:.45}}>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontSize:15,fontWeight:500,marginBottom:2}}>{fx.name}</div>
                  <div style={{fontSize:12,color:T.sub}}>{fx.currency||"USD"} · {fx.active?"Activo":"Pausado"}</div>
                </div>
                <div style={{display:"flex",flexDirection:"column",alignItems:"flex-end",marginRight:10}}>
                  <span className="mono" style={{fontSize:15,fontWeight:700}}>{fmtNum(String(fx.amount))} <span style={{fontSize:10,color:T.dim}}>{fx.currency||"USD"}</span></span>
                  {fx.currency==="UYU"&&<span style={{fontSize:10,color:T.blue,fontWeight:600}}>≈ {f2(fxToUSD(fx))}</span>}
                </div>
                <div style={{display:"flex",gap:6,flexShrink:0}}>
                  <button onClick={()=>toggle(fx.id)} style={{background:fx.active?T.greenSoft:T.bg,border:"none",borderRadius:8,padding:"6px 8px",cursor:"pointer",fontSize:11,color:fx.active?T.green:T.dim,fontWeight:600}}>{fx.active?"ON":"OFF"}</button>
                  <button onClick={()=>openEdit(fx)} style={{background:T.blueSoft,border:"none",borderRadius:8,padding:"6px 7px",cursor:"pointer",color:T.blue,display:"flex",alignItems:"center"}}><Edit3 size={13}/></button>
                  <button onClick={()=>del(fx.id)} style={{background:T.redSoft,border:"none",borderRadius:8,padding:"6px 7px",cursor:"pointer",color:T.red,display:"flex",alignItems:"center"}}><Trash2 size={13}/></button>

      {fixedExp.length===0&&<div style={{textAlign:"center",padding:"32px 20px",color:T.sub}}><div style={{fontSize:40,marginBottom:10}}>🔁</div><div style={{fontSize:15,fontWeight:600,color:T.text,marginBottom:6}}>Sin gastos fijos</div><div style={{fontSize:13}}>Agregá tus gastos recurrentes con el botón +</div></div>}
      {showForm&&(
        <Sheet title={editId?"Editar gasto fijo":"Nuevo gasto fijo"} onClose={()=>setShowForm(false)}>
          <div style={{display:"flex",flexDirection:"column",gap:12}}>

function GmailSetupWizard({gmailClientId,setGmailClientId,onConnect,onClose,gisLoaded}){
  const[step,setStep]=useState(1);
  const[inputId,setInputId]=useState(gmailClientId||"");
  const cur=SETUP_STEPS[step-1];
  const total=SETUP_STEPS.length;
  const validId=inputId.includes(".apps.googleusercontent.com")||inputId.length>20;

  return(
    <Sheet title="Configurar Gmail" onClose={onClose}>
      {/* Step indicator */}

        {SETUP_STEPS.map((_,i)=>(

            <div onClick={()=>setStep(i+1)} style={{width:28,height:28,borderRadius:14,flexShrink:0,cursor:"pointer",
              background:i+1<step?T.green:i+1===step?T.blue:T.sep,

            <div key={i} style={{display:"flex",gap:10,alignItems:"flex-start"}}>

          <input className="ifield mono" placeholder="XXXXXX.apps.googleusercontent.com" value={inputId} onChange={e=>setInputId(e.target.value)} style={{fontSize:12}}/>

            <button className="btn-blue" onClick={()=>onConnect(inputId)} style={{background:`linear-gradient(135deg,#EA4300,#FF6D00)`}}>
              <Mail size={15}/>Conectar Gmail →
            </button>
          )}
          {!gisLoaded&&<div style={{fontSize:11,color:T.dim,textAlign:"center"}} className="blink">Cargando librería de Google…</div>}
        </div>

      {/* External link */}
      {step<5&&cur.url&&(
        <a href={cur.url} target="_blank" rel="noopener noreferrer" style={{textDecoration:"none",display:"block",marginBottom:12}}>
          <div className="btn-ghost" style={{justifyContent:"center",color:T.blue,borderColor:T.blue+"40"}}>
            {cur.btnLabel} ↗

        </a>
      )}

      {/* Navigation */}
      <div style={{display:"flex",gap:10}}>
        {step>1&&<button className="btn-ghost" onClick={()=>setStep(s=>s-1)} style={{flex:1}}>← Atrás</button>}
        {step<total&&<button className="btn-blue" onClick={()=>setStep(s=>s+1)} style={{flex:2}}>Listo, siguiente →</button>}

function TabReportes({varExp,savings,fixedExp,income,toUSD,fxToUSD,last6,monthlySpend,getTot,sortedSav}){
  const projs=linReg(monthlySpend,3);
  const next3=Array.from({length:3},(_,i)=>{const d=new Date();d.setMonth(d.getMonth()+i+1);return mkKey(d);});
  const trendData=[...last6.map((mk,i)=>({name:mkLbl(mk),real:monthlySpend[i]||0})),...next3.map((mk,i)=>({name:mkLbl(mk)+"*",proj:Math.round(projs[i])}))];
  const savChart=[...savings].sort((a,b)=>new Date(a.date)-new Date(b.date)).map(e=>({name:mkLbl(mkKey(e.date)),total:getTot(e)}));
  const allCats=CATS.map(cat=>({name:cat,value:varExp.filter(t=>t.category===cat).reduce((s,t)=>s+toUSD(t),0)})).filter(d=>d.value>0).sort((a,b)=>b.value-a.value);
  const catTotal=allCats.reduce((s,d)=>s+d.value,0);
  const exportXLSX=()=>{
    const wb=XLSX.utils.book_new();
    const txRows=[...varExp].sort((a,b)=>new Date(b.date)-new Date(a.date)).map(t=>({Fecha:t.date,Comercio:t.merchant,Categoría:t.category,"UYU":t.amountUYU||"","USD":t.amountUSD||"","USD equiv.":toUSD(t).toFixed(2),Fuente:t.source}));
    XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(txRows),"Transacciones");
    const savRows=[...savings].sort((a,b)=>new Date(a.date)-new Date(b.date)).map((e,i,arr)=>{const total=getTot(e);const prev=arr[i-1];const pt=prev?getTot(prev):null;const row={Fecha:e.date};SAV_KEYS.forEach(k=>{row[SAV_INFO[k].label]=e[k];});row["Total USD"]=total.toFixed(2);row["Dif. Nominal"]=pt!=null?(total-pt).toFixed(2):"—";row["Dif. %"]=pt!=null&&pt>0?pct(((total-pt)/pt)*100):"—";return row;});
    XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(savRows),"Patrimonio");
    const fxRows=fixedExp.map(f=>({Nombre:f.name,Monto:f.amount,Moneda:f.currency||"USD","USD equiv.":fxToUSD(f).toFixed(2),Responsable:OWN[f.owner]?.label||f.owner,Estado:f.active?"Activo":"Pausado"}));
    XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(fxRows),"Gastos Fijos");
    const mRows=last6.map((mk,i)=>({Mes:mkLbl(mk),"Gasto Variable USD":monthlySpend[i].toFixed(2),"Ingreso USD":(+income?.[mk]||0).toFixed(2),"Ahorro USD":((+income?.[mk]||0)-monthlySpend[i]).toFixed(2)}));
    XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(mRows),"Resumen Mensual");
    const pRows=[...last6.map((mk,i)=>({Mes:mkLbl(mk),"Real USD":monthlySpend[i].toFixed(2),"Proyección":""})),...next3.map((mk,i)=>({Mes:mkLbl(mk)+" (proj)",Real:"","Proyección":projs[i].toFixed(2)}))];
    XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(pRows),"Proyección 3 meses");
    XLSX.writeFile(wb,`miwallet_${nowKey()}.xlsx`);
  };
  return(
    <div className="fade" style={{padding:"16px 16px 24px",display:"flex",flexDirection:"column",gap:14}}>
      <h2 style={{fontSize:22,fontWeight:700,color:T.text,letterSpacing:-.3}}>Reportes</h2>
      <div className="card" style={{padding:18}}>
        <SecLabel>Gasto mensual + proyección</SecLabel>
        <div style={{fontSize:11,color:T.dim,marginBottom:14,marginTop:2}}>6 meses reales + 3 proyectados</div>
        <ResponsiveContainer width="100%" height={170}>
          <LineChart data={trendData} margin={{top:8,bottom:0,left:0,right:8}}>
            <XAxis dataKey="name" tick={{fill:T.dim,fontSize:9}} axisLine={false} tickLine={false}/>
            <YAxis hide/>
            <Tooltip formatter={v=>v?f0(v):"—"} contentStyle={{background:T.card,border:`1px solid ${T.sep}`,borderRadius:12,fontSize:12}}/>
            <Line type="monotone" dataKey="real" stroke={T.blue} strokeWidth={2.5} dot={{fill:T.blue,r:4,strokeWidth:0}} connectNulls={false}/>
            <Line type="monotone" dataKey="proj" stroke={T.amber} strokeWidth={2} strokeDasharray="5 5" dot={{fill:T.amber,r:4,strokeWidth:0}} connectNulls={false}/>
          </LineChart>
        </ResponsiveContainer>
        <div style={{display:"flex",gap:8,marginTop:12}}>
          {next3.map((mk,i)=>(<div key={mk} style={{flex:1,background:`${T.amber}15`,borderRadius:12,padding:"9px 8px",textAlign:"center",border:`1px solid ${T.amber}30`}}><div style={{fontSize:10,color:T.sub,marginBottom:3}}>{mkLbl(mk)}</div><div className="mono" style={{fontSize:13,fontWeight:700,color:T.amber}}>{f0(projs[i])}</div></div>))}
        </div>
      </div>
      {allCats.length>0&&(
        <div className="card" style={{padding:18}}>
          <SecLabel>Distribución de gasto (USD)</SecLabel>
          <div style={{display:"flex",flexDirection:"column",gap:9,marginTop:12}}>
            {allCats.map(d=>{const p=catTotal>0?(d.value/catTotal)*100:0;return(
              <div key={d.name}>
                <div style={{display:"flex",justifyContent:"space-between",marginBottom:4}}>
                  <div style={{display:"flex",alignItems:"center",gap:7}}><div style={{width:8,height:8,borderRadius:2,background:CAT_COLORS[d.name],flexShrink:0}}/><span style={{fontSize:13,fontWeight:500}}>{d.name}</span></div>
                  <div style={{display:"flex",gap:10}}><span style={{fontSize:12,color:T.sub}}>{p.toFixed(1)}%</span><span className="mono" style={{fontSize:13,fontWeight:700}}>{f0(d.value)}</span></div>
                </div>
                <div style={{height:4,background:T.bg,borderRadius:3,overflow:"hidden"}}><div style={{height:"100%",width:`${p}%`,background:CAT_COLORS[d.name],borderRadius:3,transition:"width .4s"}}/></div>
              </div>
            );})}
          </div>
        </div>

      {savChart.length>1&&(
        <div className="card" style={{padding:18}}>
          <SecLabel>Crecimiento patrimonial (USD)</SecLabel>
          <ResponsiveContainer width="100%" height={130}>
            <BarChart data={savChart} barSize={24} margin={{top:8,bottom:0}}>
              <XAxis dataKey="name" tick={{fill:T.dim,fontSize:10}} axisLine={false} tickLine={false}/>
              <YAxis hide/>
              <Tooltip formatter={v=>f0(v)} contentStyle={{background:T.card,border:`1px solid ${T.sep}`,borderRadius:12,fontSize:12}}/>
              <Bar dataKey="total" fill={T.green} radius={[6,6,0,0]} opacity={.9}/>
            </BarChart>
          </ResponsiveContainer>
        </div>

      {fixedExp.length>0&&(
        <div className="card" style={{padding:18}}>
          <SecLabel>Gastos fijos por responsable (USD/mes)</SecLabel>
          <div style={{display:"flex",gap:10,marginTop:12}}>
            {OWNERS.map(o=>{const tot=fixedExp.filter(f=>f.active&&f.owner===o).reduce((s,f)=>s+fxToUSD(f),0);if(!tot)return null;return(<div key={o} style={{flex:1,background:OWN[o].soft,borderRadius:14,padding:"12px 10px",textAlign:"center",border:`1px solid ${OWN[o].color}25`}}><div style={{fontSize:20,marginBottom:4}}>{OWN[o].icon}</div><div style={{fontSize:12,fontWeight:600,color:OWN[o].color,marginBottom:2}}>{OWN[o].label}</div><div className="mono" style={{fontSize:15,fontWeight:700,color:T.text}}>{f0(tot)}</div></div>);})}
          </div>
        </div>
      )}
      <button className="btn-blue" onClick={exportXLSX} style={{padding:"15px 20px",fontSize:15,borderRadius:16}}><Download size={18}/>Exportar Excel (.xlsx)</button>
    </div>
  );
}

/* ═══ SHARED ═══ */
function Sheet({title,onClose,children}){
  return(
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.5)",display:"flex",alignItems:"flex-end",justifyContent:"center",zIndex:200}}>
      <div className="sheet-up" style={{background:T.card,borderRadius:"24px 24px 0 0",padding:"20px 20px 32px",width:"100%",maxWidth:430,maxHeight:"92vh",overflowY:"auto"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20}}>
          <span style={{fontSize:17,fontWeight:700,color:T.text}}>{title}</span>
          <button onClick={onClose} style={{background:T.bg,border:"none",borderRadius:10,padding:"7px",cursor:"pointer",color:T.sub,display:"flex",alignItems:"center"}}><X size={18}/></button>
        </div>
        {children}
      </div>
    </div>
  );
}
function TxMiniRow({tx,toUSD,effRate}){
  return(
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
      <div style={{flex:1,minWidth:0}}><div style={{fontSize:14,fontWeight:500,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{tx.merchant}</div><div style={{display:"flex",gap:6,alignItems:"center",marginTop:2}}><CatBadge cat={tx.category}/><span style={{fontSize:10,color:T.dim}}>{tx.date}</span></div></div>
      <div style={{textAlign:"right",marginLeft:12}}><span className="mono" style={{fontSize:14,fontWeight:700,color:T.red}}>-{f2(toUSD(tx))}</span>{tx.amountUYU&&effRate&&<div style={{fontSize:9,color:T.dim}}>{tx.amountUYU.toLocaleString("es-UY")} UYU</div>}</div>
    </div>
  );
}
function CatBadge({cat}){const col=CAT_COLORS[cat]||T.sub;return <span style={{fontSize:10,background:col+"18",color:col,padding:"2px 7px",borderRadius:20,fontWeight:600,whiteSpace:"nowrap"}}>{cat}</span>;}
function OwnerBadge({owner,small}){const cfg=OWN[owner]||OWN.compartido;return <span style={{fontSize:small?10:11,background:cfg.soft,color:cfg.color,padding:small?"2px 7px":"3px 9px",borderRadius:20,fontWeight:700,whiteSpace:"nowrap"}}>{cfg.icon} {cfg.label}</span>;}
function SecLabel({children}){return <div style={{fontSize:11,color:T.sub,textTransform:"uppercase",letterSpacing:1.2,fontWeight:600}}>{children}</div>;}

    ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
  </script>
